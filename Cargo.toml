[workspace]
members = [
    "crates/mmlx-macros",
    "crates/mmlx-core",
    "crates/mmlx-synth",
    "crates/mmlx-audio",
    "crates/mmlx-repl",
    "crates/mmlx-server",
    "crates/mmlx-algo",
    "crates/mmlx-fx",
    "crates/mmlx-clap",
    "crates/mmlx-chip",
    "crates/mmlx-ym",
    "crates/mmlx-sf2",
    "crates/mmlx-midi",
    "crates/mmlx-track",
    "crates/mmlx-vgm",
    "crates/mmlx-songs",
    "crates/genawaiter",
    "crates/genawaiter-macro",
    "crates/genawaiter-proc-macro",
]
resolver = "2"

[workspace.dependencies]
genawaiter = { path = "crates/genawaiter" }
mmlx-core = { path = "crates/mmlx-core" }
mmlx-macros = { path = "crates/mmlx-macros" }
mmlx-synth = { path = "crates/mmlx-synth" }
mmlx-chip = { path = "crates/mmlx-chip" }
mmlx-ym = { path = "crates/mmlx-ym" }
mmlx-audio = { path = "crates/mmlx-audio" }
mmlx-fx = { path = "crates/mmlx-fx" }
mmlx-algo = { path = "crates/mmlx-algo" }

[profile.dev]
# Fast iteration: line tables keep backtraces usable; full debuginfo on
# macro-generated song crates costs minutes per link for no daily benefit.
# Release/audit builds keep full details; override per-command if needed.
debug = 1